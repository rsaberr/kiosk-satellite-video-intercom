name: Release
# Push a version tag (git tag v1.2.3 && git push origin v1.2.3). This workflow tests and builds the tagged source,
# then creates the release and attaches the manifest, the ZIP and its checksum, all as github-actions[bot], which is
# what Kiosk Satellite checks before it installs a release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test
        run: python3 tools/test.py
      - name: Build
        run: python3 tools/build.py --android-platform 35 --version "${GITHUB_REF_NAME#v}"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 dist/kiosk-satellite-plugin.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
